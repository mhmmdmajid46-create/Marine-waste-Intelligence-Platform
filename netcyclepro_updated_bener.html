<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETCYCLE — Marine & Waste Intelligence Platform</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deep: '#030f1c',
            surface: '#0a1e33',
            card: '#0f2942',
            accent: '#0ea5e9',
            teal2: '#14b8a6',
            coral: '#f97316',
            danger: '#ef4444',
            success: '#22c55e',
            warn: '#eab308'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>window.lucide = window.lucide || { createIcons() {} }; /* cadangan jika ikon gagal dimuat */</script>
  
  <!-- Leaflet GIS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    body { background-color: #030f1c; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .glass { background: rgba(10, 30, 51, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .nav-btn.active { background: linear-gradient(135deg, rgba(14,165,233,0.2), rgba(20,184,166,0.1)); color: #0ea5e9; border-left: 3px solid #0ea5e9; }
    .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(0.9); } }
    .leaflet-container { background: #0a1e33 !important; }
  
    /* ===== Pemilih tahun survei (GIS) ===== */
    .yr-card { display:flex; gap:24px; align-items:stretch; background:#fff; color:#0f172a; border-radius:18px; padding:18px 22px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
    .yr-col { min-width:0; }
    .yr-col.main { flex:1.4; }
    .yr-col.side { flex:1; }
    .yr-divider { width:1px; flex:none; background:#e2e8f0; }
    .yr-label { margin-bottom:12px; font-size:11px; font-weight:700; letter-spacing:.14em; color:#475569; text-transform:uppercase; }
    .yr-label small { margin-left:4px; font-size:11px; font-weight:500; letter-spacing:0; color:#94a3b8; text-transform:none; }
    .yr-row { display:flex; align-items:center; gap:10px; }
    .yr-list { display:flex; flex:1; gap:10px; min-width:0; padding:4px 3px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; }
    .yr-list::-webkit-scrollbar { display:none; }
    .yr-pill { flex:none; min-width:84px; padding:9px 22px; font:inherit; font-size:15px; font-weight:500; color:#334155; background:#fff; border:1px solid #e2e8f0; border-radius:999px; cursor:pointer; transition:background .15s, border-color .15s, box-shadow .15s; }
    .yr-pill:hover { background:#fff7ed; border-color:#fdba74; }
    .yr-pill.active { font-weight:700; color:#0f172a; background:#ffedd5; border-color:#f97316; box-shadow:0 0 0 1px #f97316; }
    .yr-arrow { flex:none; width:40px; height:40px; display:grid; place-items:center; font-size:20px; line-height:1; color:#334155; background:#fff; border:1px solid #e2e8f0; border-radius:50%; cursor:pointer; transition:background .15s, border-color .15s; }
    .yr-arrow:hover:not(:disabled) { background:#f8fafc; border-color:#94a3b8; }
    .yr-arrow:disabled { opacity:.35; cursor:not-allowed; }
    .yr-pill:focus-visible, .yr-arrow:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .yr-area { display:flex; align-items:center; gap:10px; height:42px; padding:0 16px; font-size:15px; font-weight:600; color:#1d4ed8; border:1px solid #e2e8f0; border-radius:12px; }
    .gis-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; font-size:13px; font-weight:700; color:#fdba74; background:rgba(249,115,22,.12); border:1px solid #f97316; border-radius:12px; white-space:nowrap; }
    @media (max-width: 900px) {
      .yr-card { flex-direction:column; gap:16px; }
      .yr-divider { width:100%; height:1px; }
    }
  
    /* ===== Halaman GIS: tata letak, peta, statistik, grafik ===== */
    .gis-page { display:flex; flex-direction:column; gap:16px; padding-bottom:24px; }
    .gis-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
    .gis-title { font-size:15px; font-weight:700; color:#fff; }
    .gis-sub { margin-top:2px; font-size:12px; color:#94a3b8; }
    .gis-main { display:grid; grid-template-columns:minmax(0,2fr) minmax(280px,1fr); gap:16px; align-items:stretch; }
    .gis-mapcol { display:flex; flex-direction:column; gap:10px; min-width:0; }
    .gis-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .gis-status { font-size:12px; color:#2dd4bf; }
    .gis-status.err { color:#f87171; }
    .gis-tilewarn { display:none; margin-top:2px; font-size:12px; color:#fbbf24; }
    .gis-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .gis-btn { padding:6px 12px; font:inherit; font-size:12px; font-weight:600; color:#cbd5e1; background:rgba(30,41,59,.6); border:1px solid #334155; border-radius:8px; cursor:pointer; transition:color .15s, border-color .15s; }
    .gis-btn:hover { color:#fff; border-color:#64748b; }
    .gis-chip { padding:6px 12px; font-family:monospace; font-size:12px; color:#2dd4bf; background:rgba(45,212,191,.1); border:1px solid rgba(45,212,191,.25); border-radius:8px; white-space:nowrap; }
    .gis-map-wrap { position:relative; height:560px; overflow:hidden; background:#0a1424; border:1px solid #1e293b; border-radius:18px; }
    .gis-map { position:absolute; inset:0; }
    .gis-fab { position:absolute; top:12px; right:12px; z-index:1000; width:40px; height:40px; font-size:18px; color:#fff; background:#f97316; border:0; border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.4); cursor:pointer; }
    .gis-card { color:#0f172a; background:#fff; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.35); font-size:13px; }
    .gis-panel { position:absolute; top:60px; right:12px; z-index:1000; width:250px; padding:16px; }
    .gis-legend { position:absolute; left:12px; bottom:28px; z-index:1000; min-width:190px; padding:14px 16px; }
    .gis-cap { margin-bottom:8px; font-size:11px; font-weight:700; letter-spacing:.12em; color:#64748b; }
    .gis-opt { display:flex; align-items:center; gap:8px; margin:6px 0; cursor:pointer; }
    .gis-sep { margin:10px 0; border-top:1px solid #e2e8f0; }
    .gis-sw { display:inline-block; width:14px; height:14px; border-radius:3px; }

    .eco-seg { display:inline-flex; gap:4px; padding:4px; background:#f1f5f9; border-radius:999px; max-width:100%; flex-wrap:wrap; }
    .eco-btn { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; font:inherit; font-size:14px; font-weight:600; color:#475569; white-space:nowrap; background:transparent; border:0; border-radius:999px; cursor:pointer; transition:background .15s, color .15s, box-shadow .15s; }
    .eco-btn .dot { width:10px; height:10px; border-radius:50%; }
    .eco-btn:hover { background:#e2e8f0; }
    .eco-btn.active { color:#0f172a; background:#fff; box-shadow:0 1px 4px rgba(15,23,42,.2), 0 0 0 1px #f97316; }
    .eco-btn:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .yr-col.mid { flex:1.3; }
    .yr-col.side { flex:.8; }

    .gis-stats { padding:22px; color:#e2e8f0; background:linear-gradient(180deg,#0f2038,#0a1424); border:1px solid #1e293b; border-radius:18px; }
    .st-top { display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.14em; }
    .st-name { margin:14px 0 4px; font-size:26px; font-weight:800; color:#fff; }
    .st-src { margin-bottom:18px; font-size:12px; color:#94a3b8; }
    .st-bar { display:flex; height:10px; margin-bottom:6px; overflow:hidden; background:#1e293b; border-radius:6px; }
    .st-barlbl { display:flex; justify-content:space-between; margin-bottom:12px; font-size:11px; color:#94a3b8; }
    .st-row { display:flex; justify-content:space-between; align-items:center; padding:13px 0; font-size:14px; border-bottom:1px solid #1e293b; transition:opacity .2s; }
    .st-row:first-of-type { border-top:1px solid #1e293b; }
    .st-row:last-child { border-bottom:0; }
    .st-row > span:last-child, .st-row > b { text-align:right; }
    .st-row small { display:block; font-size:11px; color:#94a3b8; }
    .st-row.dim { opacity:.3; }

    .gis-charts { padding:22px; background:linear-gradient(180deg,#0f2038,#0a1424); border:1px solid #1e293b; border-radius:18px; }
    .gis-charts-head { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
    .cg-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .cg-card { min-width:0; padding:18px; background:rgba(15,23,42,.55); border:1px solid #1e293b; border-radius:14px; }
    .cg-card.span2 { grid-column:span 2; }
    .cg-title { font-size:13px; font-weight:700; color:#fff; }
    .cg-note { margin:2px 0 12px; font-size:11px; color:#94a3b8; }
    .cg-box { position:relative; height:270px; }
    .cg-table { width:100%; border-collapse:collapse; font-size:13px; }
    .cg-table th { padding:8px 12px; font-size:11px; font-weight:700; letter-spacing:.06em; text-align:right; color:#94a3b8; border-bottom:1px solid #334155; white-space:nowrap; }
    .cg-table td { padding:11px 12px; text-align:right; color:#e2e8f0; border-bottom:1px solid #1e293b; white-space:nowrap; }
    .cg-table th:first-child, .cg-table td:first-child { text-align:left; }
    .cg-table tr.cur td { font-weight:700; background:rgba(249,115,22,.12); }
    .cg-table td.up { color:#4ade80; }
    .cg-table td.down { color:#f87171; }
    .cg-table td.muted { color:#64748b; }
    @media (max-width: 1100px) {
      .gis-main { grid-template-columns:1fr; }
      .cg-grid { grid-template-columns:1fr; }
      .cg-card.span2 { grid-column:auto; }
    }

    /* ===== Kartu filter tahun: tema gelap, sama seperti panel statistik/grafik ===== */
    .yr-card { color:#e2e8f0; background:linear-gradient(180deg,#0f2038,#0a1424); border:1px solid #1e293b; border-radius:18px; box-shadow:none; padding:22px; }
    .yr-label { color:#94a3b8; }
    .yr-label small { color:#64748b; }
    .yr-divider { background:#1e293b; }
    .yr-pill { color:#cbd5e1; background:rgba(15,23,42,.55); border:1px solid #334155; }
    .yr-pill:hover { background:rgba(249,115,22,.12); border-color:#f97316; }
    .yr-pill.active { color:#fff; background:rgba(249,115,22,.18); border-color:#f97316; box-shadow:0 0 0 1px #f97316; }
    .yr-arrow { color:#cbd5e1; background:rgba(15,23,42,.55); border:1px solid #334155; }
    .yr-arrow:hover:not(:disabled) { background:rgba(30,41,59,.8); border-color:#64748b; }
    .eco-seg { background:rgba(15,23,42,.55); border:1px solid #1e293b; }
    .eco-btn { color:#94a3b8; }
    .eco-btn:hover { background:rgba(30,41,59,.8); color:#fff; }
    .eco-btn.active { color:#fff; background:rgba(249,115,22,.18); box-shadow:0 0 0 1px #f97316; }

    /* ===== Persebaran ikan ===== */
    .fish-seg { display:flex; flex-wrap:wrap; gap:8px; }
    .fish-chip { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; font:inherit; font-size:14px; font-weight:600; color:#94a3b8; background:rgba(15,23,42,.55); border:1px solid #334155; border-radius:999px; cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
    .fish-chip .dot { width:10px; height:10px; border-radius:50%; opacity:.4; }
    .fish-chip small { padding:1px 7px; font-size:11px; font-weight:600; color:#94a3b8; background:rgba(148,163,184,.14); border-radius:999px; }
    .fish-chip:hover { color:#fff; background:rgba(30,41,59,.8); }
    .fish-chip.active { color:#fff; background:rgba(15,23,42,.85); border-color:var(--c); box-shadow:0 0 0 1px var(--c); }
    .fish-chip.active .dot { opacity:1; }
    .fish-chip:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .fish-dot { display:inline-block; width:10px; height:10px; margin-right:8px; border-radius:50%; }
    .gis-legend { max-height:calc(100% - 40px); overflow-y:auto; }
    .cg-card.span3 { grid-column:span 3; }
    @media (max-width: 1100px) { .cg-card.span3 { grid-column:auto; } }

    /* ===== Menu layer (tab) ===== */
    .menu-card { flex-direction:column; gap:16px; }
    .menu-tabs { display:flex; gap:8px; flex-wrap:wrap; padding:4px; background:rgba(15,23,42,.55); border:1px solid #1e293b; border-radius:14px; width:fit-content; max-width:100%; }
    .menu-tab { display:inline-flex; align-items:center; gap:8px; padding:9px 18px; font:inherit; font-size:14px; font-weight:600; color:#94a3b8; background:transparent; border:0; border-radius:10px; cursor:pointer; transition:background .15s, color .15s; }
    .menu-tab small { padding:1px 8px; font-size:11px; color:#94a3b8; background:rgba(148,163,184,.14); border-radius:999px; }
    .menu-tab:hover { color:#fff; background:rgba(30,41,59,.8); }
    .menu-tab.active { color:#fff; background:rgba(249,115,22,.18); box-shadow:0 0 0 1px #f97316; }
    .menu-tab:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .menu-panel { display:none; flex-direction:column; gap:14px; }
    .menu-panel.show { display:flex; }
    .menu-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .menu-title { font-size:13px; font-weight:700; color:#fff; }
    .menu-title small { margin-left:6px; font-size:11px; font-weight:500; color:#64748b; }
    .fish-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
    .fish-item { display:flex; align-items:center; gap:10px; padding:10px 12px; font:inherit; text-align:left; color:#94a3b8; background:rgba(15,23,42,.55); border:1px solid #334155; border-radius:12px; cursor:pointer; transition:background .15s, border-color .15s, color .15s; }
    .fish-item:hover { color:#fff; background:rgba(30,41,59,.8); }
    .fish-item.active { color:#fff; border-color:var(--c); box-shadow:0 0 0 1px var(--c); background:rgba(15,23,42,.85); }
    .fish-item .box { flex:none; width:18px; height:18px; display:grid; place-items:center; font-size:12px; font-weight:800; color:transparent; border:1.5px solid #475569; border-radius:5px; }
    .fish-item.active .box { color:#0f172a; background:var(--c); border-color:var(--c); }
    .fish-item .nm { flex:1; min-width:0; font-size:14px; font-weight:600; }
    .fish-item .mt { text-align:right; font-size:11px; line-height:1.3; color:#94a3b8; white-space:nowrap; }
    .fish-item .mt b { display:block; font-size:12px; color:#e2e8f0; }
    .fish-item:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .jr-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
    .jr-tile { padding:12px 14px; background:rgba(15,23,42,.55); border:1px solid #1e293b; border-radius:12px; }
    .jr-tile b { display:block; font-size:18px; color:#fff; }
    .jr-tile span { font-size:11px; color:#94a3b8; }
    .jr-src { font-size:11px; color:#64748b; }
    .st-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
    .st-item { display:flex; gap:12px; align-items:flex-start; padding:12px; font:inherit; text-align:left; color:#cbd5e1; background:rgba(15,23,42,.55); border:1px solid #334155; border-radius:12px; cursor:pointer; transition:background .15s, border-color .15s; }
    .st-item:hover { background:rgba(30,41,59,.8); border-color:var(--c); }
    .st-item:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .st-num { flex:none; width:30px; height:30px; display:grid; place-items:center; font-size:14px; font-weight:800; color:#0f172a; background:var(--c); border-radius:50%; }
    .st-item .nm { font-size:13px; font-weight:700; color:#fff; }
    .st-item .zn { font-size:11px; color:#94a3b8; }
    .st-item .hl { margin-top:4px; font-size:12px; color:#e2e8f0; }
    .stn-pin { display:grid; place-items:center; width:28px; height:28px; font:800 13px sans-serif; color:#0f172a; border:2px solid #fff; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,.5); }
    .eco-btn:disabled { opacity:.45; cursor:not-allowed; }
    .eco-btn:disabled:hover { background:transparent; color:#94a3b8; }
    .eco-btn small { font-size:10px; font-weight:500; color:#64748b; }

    /* ===== Dropdown pilihan ikan ===== */
    .dd { position:relative; width:min(460px,100%); }
    .dd-btn { display:flex; align-items:center; gap:12px; width:100%; padding:10px 14px; font:inherit; text-align:left; color:#e2e8f0; background:rgba(15,23,42,.55); border:1px solid #334155; border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s; }
    .dd-btn:hover, .dd.open .dd-btn { background:rgba(30,41,59,.8); border-color:#f97316; }
    .dd-btn:focus-visible { outline:2px solid #f97316; outline-offset:2px; }
    .dd-txt { flex:1; min-width:0; display:flex; flex-direction:column; }
    .dd-txt b { font-size:14px; color:#fff; }
    .dd-txt small { font-size:11px; color:#94a3b8; }
    .dd-dots { display:flex; gap:3px; flex-wrap:nowrap; }
    .dd-dots i { width:9px; height:9px; border-radius:50%; }
    .dd-caret { font-size:14px; color:#94a3b8; transition:transform .15s; }
    .dd.open .dd-caret { transform:rotate(180deg); }
    .dd-menu { display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:1200; width:100%; max-height:380px; overflow-y:auto; padding:12px; background:#0f2038; border:1px solid #334155; border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.55); }
    .dd.open .dd-menu { display:block; }
    .dd-top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .dd-sub { font-size:11px; color:#94a3b8; }
    .dd-list { display:flex; flex-direction:column; gap:6px; }

    /* ===== Tampilan HP / layar kecil ===== */
    .burger { display:none; width:40px; height:40px; flex:none; align-items:center; justify-content:center; font-size:20px; color:#e2e8f0; background:rgba(15,23,42,.7); border:1px solid #334155; border-radius:10px; cursor:pointer; }
    #sb-backdrop { display:none; }
    html, body { overflow-x:hidden; }
    @media (max-width: 767px) {
      .burger { display:inline-flex; }
      #sidebar { position:fixed; top:0; bottom:0; left:0; z-index:70; transform:translateX(-100%); transition:transform .25s ease; box-shadow:8px 0 32px rgba(0,0,0,.5); }
      #sidebar.open { transform:none; }
      #sb-backdrop.show { display:block; position:fixed; inset:0; z-index:65; background:rgba(2,8,23,.6); }
      #topbar { padding-left:12px; padding-right:12px; gap:8px; }
      #topbar #view-title { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw; }
      #topbar .cloud-badge { display:none; }
      #main-view { padding:12px; }
      .yr-card { padding:14px; }
      .yr-pill { min-width:72px; padding:8px 16px; font-size:14px; }
      .eco-seg { flex-wrap:wrap; }
      .gis-map-wrap { height:420px; border-radius:14px; }
      .gis-panel { width:210px; top:58px; }
      .gis-legend { min-width:0; max-width:62%; max-height:45%; padding:10px 12px; bottom:24px; font-size:12px; }
      .gis-stats, .gis-charts { padding:16px; }
      .gis-toolbar .gis-tools { width:100%; }
      .gis-chip { display:none; }
      .st-list, .fish-grid { grid-template-columns:1fr; }
      .menu-tab { padding:8px 12px; font-size:13px; }
      .dd { width:100%; }
      .cg-table { font-size:12px; }
    }

    /* ===== Legenda & panel layer: tema gelap, ringkas ===== */
    .gis-card { color:#e2e8f0; background:rgba(10,20,36,.9); border:1px solid #1e293b; backdrop-filter:blur(6px); }
    .gis-cap { color:#94a3b8; }
    .gis-sep { border-top-color:#1e293b; }
    .gis-panel { padding:14px 16px; }

  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ================= AUTH OVERLAY ================= -->
  <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-deep/95 backdrop-blur-md">

        <div class="inline-flex p-3 rounded-2xl bg-gradient-to-tr from-accent to-teal2 mb-3 shadow-lg shadow-accent/20">

        </div>
        <h1 class="text-2xl font-black tracking-tight text-white">NETCYCLE <span class="text-accent text-sm font-normal">ENTERPRISE</span></h1>

        <button onclick="App.login()" class="w-full py-2.5 rounded-lg bg-gradient-to-r from-accent to-teal2 font-bold text-sm text-white hover:opacity-90 transition">Masuk ke Konsol</button>

        <div class="pt-4 border-t border-slate-800">

          <div class="grid grid-cols-2 gap-2 text-xs">
            <button onclick="App.quickAuth('admin@netcycle.id')" class="p-2 bg-card rounded border border-slate-700 hover:border-accent text-left">👑 <b>Admin</b></button>
            <button onclick="App.quickAuth('warga@netcycle.id')" class="p-2 bg-card rounded border border-slate-700 hover:border-accent text-left">👤 <b>Warga/Pesisir</b></button>
            <button onclick="App.quickAuth('kurir@netcycle.id')" class="p-2 bg-card rounded border border-slate-700 hover:border-accent text-left">🚚 <b>Logistik/Kurir</b></button>
            <button onclick="App.quickAuth('pabrik@netcycle.id')" class="p-2 bg-card rounded border border-slate-700 hover:border-accent text-left">🏭 <b>Pabrik Daur Ulang</b></button>

  <!-- ================= MAIN LAYOUT ================= -->
  <div id="app" class="flex-1 flex overflow-hidden">
    <!-- SIDEBAR -->
    <div id="sb-backdrop" onclick="closeSidebar()"></div>
    <aside id="sidebar" class="w-64 bg-surface border-r border-slate-800 flex flex-col shrink-0">

        <div>
          <span class="font-black text-base tracking-wide bg-gradient-to-r from-accent to-teal2 bg-clip-text text-transparent">NETCYCLE</span>
          <span class="block text-[9px] mono text-slate-500">MARITIME SUITE v3.0</span>
        </div>

      <div class="p-4 mx-3 my-3 bg-deep rounded-xl border border-slate-800 flex items-center gap-3">

        <button onclick="App.navigate('reports')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-nav-reports"><i data-lucide="recycle" class="w-4 h-4"></i> Laporan Sampah</button>
        <button onclick="App.navigate('gis')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-nav-gis"><i data-lucide="map" class="w-4 h-4"></i> GIS & Oseanografi</button>
        <button onclick="App.navigate('factory')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-nav-factory"><i data-lucide="factory" class="w-4 h-4"></i> Produksi Sirkular</button>
        <button onclick="App.navigate('game')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-nav-game"><i data-lucide="gamepad-2" class="w-4 h-4"></i> Ocean Game</button>
        <button onclick="App.navigate('audit')" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-nav-audit"><i data-lucide="shield-check" class="w-4 h-4"></i> Audit Log Ledger</button>
      </nav>

      <div class="p-3 border-t border-slate-800">
        <button onclick="App.logout()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-danger hover:bg-danger/10 transition"><i data-lucide="log-out" class="w-4 h-4"></i> Keluar Sistem</button>
      </div>
    </aside>

    <!-- CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- TOPBAR -->
      <header id="topbar" class="h-16 bg-surface/70 border-b border-slate-800 px-6 flex items-center justify-between">
        <div class="flex items-center gap-3 min-w-0">
          <button class="burger" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>
          <h2 id="view-title" class="text-base font-bold text-white">Dashboard Monitoring</h2>
          <span class="cloud-badge inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] mono bg-success/10 text-success border border-success/30">
            <span class="w-1.5 h-1.5 rounded-full bg-success pulse-dot"></span> CLOUD CONNECTED
          </span>
        </div>

        <div class="flex items-center gap-4 text-xs">
          <div class="hidden md:flex items-center gap-3 mono bg-deep px-3 py-1.5 rounded-lg border border-slate-800 text-slate-400">
            <span>WIB: <b id="t-wib" class="text-accent">00:00:00</b></span>
            <span>WITA: <b id="t-wita" class="text-teal2">00:00:00</b></span>
          </div>
          <div class="flex items-center gap-2 bg-deep px-3 py-1.5 rounded-lg border border-slate-800">
            <i data-lucide="coins" class="w-4 h-4 text-yellow-400"></i>
            <span class="text-slate-400">Poin:</span>
            <span id="user-points" class="font-bold text-yellow-400 mono">0</span>
          </div>
        </div>
      </header>

      <!-- DYNAMIC VIEWS -->
      <main class="flex-1 overflow-y-auto p-6 bg-deep/50" id="main-view"></main>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    function toggleSidebar() {
      const sb = document.getElementById('sidebar'), bd = document.getElementById('sb-backdrop');
      if (!sb) return;
      const open = sb.classList.toggle('open');
      if (bd) bd.classList.toggle('show', open);
    }
    function closeSidebar() {
      const sb = document.getElementById('sidebar'), bd = document.getElementById('sb-backdrop');
      if (sb) sb.classList.remove('open');
      if (bd) bd.classList.remove('show');
    }
    // ================= 1. BACKEND STATE ENGINE (LOCALSTORAGE) =================
    const DB = {
      init() {
        if (!localStorage.getItem('NC_USERS')) {
          localStorage.setItem('NC_USERS', JSON.stringify([
            { id: 1, email: 'admin@netcycle.id', name: 'Super Admin', role: 'admin', points: 5000 },
            { id: 2, email: 'warga@netcycle.id', name: 'Budi Nelayan', role: 'warga', points: 140 },
            { id: 3, email: 'kurir@netcycle.id', name: 'Agus Logistik', role: 'kurir', points: 320 },
            { id: 4, email: 'pabrik@netcycle.id', name: 'PT Sirkular Samudra', role: 'pabrik', points: 890 }
          ]));
        }
        if (!localStorage.getItem('NC_REPORTS')) {
          localStorage.setItem('NC_REPORTS', JSON.stringify([
            { id: 'TRX-101', reporter: 'Budi Nelayan', type: 'Jaring Hantu (Ghost Net)', weight: 35.5, loc: 'Teluk Jakarta', lat: -6.08, lng: 106.85, status: 'Menunggu', date: '2025-05-10 09:30' },
            { id: 'TRX-102', reporter: 'Siti Muara', type: 'Mikroplastik & Botol PET', weight: 12.0, loc: 'Pantai Kenjeran, Sby', lat: -7.24, lng: 112.79, status: 'Disetujui', date: '2025-05-11 11:15' },
            { id: 'TRX-103', reporter: 'Kelompok Nelayan Bali', type: 'Plastik Keras HDPE', weight: 80.0, loc: 'Tanjung Benoa', lat: -8.76, lng: 115.22, status: 'Diproses Pabrik', date: '2025-05-12 14:00' }
          ]));
        }
        if (!localStorage.getItem('NC_FACTORY')) {
          localStorage.setItem('NC_FACTORY', JSON.stringify({
            rawMaterialKg: 340,
            pelletsProducedKg: 280,
            ecoProductsCount: 142
          }));
        }
        if (!localStorage.getItem('NC_LEDGER')) {
          localStorage.setItem('NC_LEDGER', JSON.stringify([
            { id: 1, action: 'SYSTEM_BOOT', note: 'Sistem NetCycle berhasil dimuat', time: new Date().toLocaleTimeString() }
          ]));
        }
      },
      get(k) { return JSON.parse(localStorage.getItem(k)); },
      set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
      log(action, note) {
        const ledger = DB.get('NC_LEDGER') || [];
        ledger.unshift({ id: Date.now(), action, note, time: new Date().toLocaleTimeString() });
        DB.set('NC_LEDGER', ledger);
      }
    };

    // ================= 2. APP STATE CONTROLLER =================
    const App = {
      currentUser: null,
      currentView: 'dashboard',
      chartInstance: null,
      leafletMap: null,
      gameLoop: null,

      init() {
        DB.init();
        const savedUser = sessionStorage.getItem('NC_AUTH');
        if (savedUser) {
          this.currentUser = JSON.parse(savedUser);
          document.getElementById('auth-overlay').classList.add('hidden');
          this.syncUserProfile();
          this.navigate('dashboard');
        } else {
          document.getElementById('auth-overlay').classList.remove('hidden');
        }

        setInterval(this.updateClocks, 1000);
        lucide.createIcons();
      },

      updateClocks() {
        const d = new Date();
        const wib = new Date(d.getTime() + (d.getTimezoneOffset() + 420) * 60000);
        const wita = new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000);
        const elWib = document.getElementById('t-wib');
        const elWita = document.getElementById('t-wita');
        if (elWib) elWib.innerText = wib.toTimeString().split(' ')[0];
        if (elWita) elWita.innerText = wita.toTimeString().split(' ')[0];
      },

      quickAuth(email) {
        document.getElementById('inp-email').value = email;
        this.login();
      },

      login() {
        const email = document.getElementById('inp-email').value;
        const users = DB.get('NC_USERS');
        const u = users.find(x => x.email.toLowerCase() === email.toLowerCase());

        if (u) {
          this.currentUser = u;
          sessionStorage.setItem('NC_AUTH', JSON.stringify(u));
          document.getElementById('auth-overlay').classList.add('hidden');
          this.syncUserProfile();
          DB.log('AUTH_LOGIN', `Pengguna ${u.name} (${u.role}) masuk ke sistem.`);
          this.navigate('dashboard');
        } else {
          alert('Pengguna tidak ditemukan!');
        }
      },

      logout() {
        DB.log('AUTH_LOGOUT', `Pengguna ${this.currentUser.name} keluar.`);
        sessionStorage.removeItem('NC_AUTH');
        location.reload();
      },

      syncUserProfile() {
        if (!this.currentUser) return;
        document.getElementById('u-name').innerText = this.currentUser.name;
        document.getElementById('u-role').innerText = this.currentUser.role.toUpperCase();
        document.getElementById('u-avatar').innerText = this.currentUser.name.substring(0, 2).toUpperCase();
        document.getElementById('user-points').innerText = this.currentUser.points.toLocaleString('id-ID');
      },

      navigate(view) {
        closeSidebar();
        this.currentView = view;
        if (this.gameLoop) { cancelAnimationFrame(this.gameLoop); this.gameLoop = null; }

        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const activeNav = document.getElementById(`btn-nav-${view}`);
        if (activeNav) activeNav.classList.add('active');

        const container = document.getElementById('main-view');
        const titles = {
          dashboard: 'Ringkasan Eksekutif & Real-time Metrics',
          reports: 'Registri Penjemputan Sampah Pesisir',
          gis: 'Pemetaan Spasial Arus Laut & Sebaran Sampah',
          factory: 'Pusat Pemurnian & Produksi Sirkular',
          game: 'Simulasi Pembersihan Laut (Canvas Arcade)',
          audit: 'Buku Besar Transaksi & Audit Log'
        };
        document.getElementById('view-title').innerText = titles[view] || 'Console';

        // Render Views
        switch(view) {
          case 'dashboard': this.renderDashboard(container); break;
          case 'reports': this.renderReports(container); break;
          case 'gis': this.renderGIS(container); break;
          case 'factory': this.renderFactory(container); break;
          case 'game': this.renderGame(container); break;
          case 'audit': this.renderAudit(container); break;
        }
        lucide.createIcons();
      },

      // ================= VIEW: DASHBOARD =================
      renderDashboard(target) {
        const reports = DB.get('NC_REPORTS');
        const factory = DB.get('NC_FACTORY');
        const totalKg = reports.reduce((acc, r) => acc + Number(r.weight), 0);

        target.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="glass p-4 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">Total Sampah Terangkat</span>
              <div class="text-2xl font-black text-accent mono">${totalKg.toFixed(1)} <span class="text-sm font-normal text-slate-400">Kg</span></div>
            </div>
            <div class="glass p-4 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">Pellet Dihasilkan</span>
              <div class="text-2xl font-black text-teal2 mono">${factory.pelletsProducedKg} <span class="text-sm font-normal text-slate-400">Kg</span></div>
            </div>
            <div class="glass p-4 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">Produk Sirkular Selesai</span>
              <div class="text-2xl font-black text-coral mono">${factory.ecoProductsCount} <span class="text-sm font-normal text-slate-400">Unit</span></div>
            </div>
            <div class="glass p-4 rounded-xl border border-slate-800">
              <span class="text-xs text-slate-400 block mb-1">Indeks Kualitas Laut</span>
              <div class="text-2xl font-black text-success mono">84.2% <span class="text-sm font-normal text-slate-400">Optimal</span></div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 glass p-5 rounded-2xl border border-slate-800">
              <h3 class="text-sm font-bold mb-4 flex items-center gap-2"><i data-lucide="line-chart" class="w-4 h-4 text-accent"></i> Tren Pengumpulan Limbah (Kg/Bulan)</h3>
              <div class="h-64"><canvas id="dashboardChart"></canvas></div>
            </div>
            <div class="glass p-5 rounded-2xl border border-slate-800 flex flex-col justify-between">
              <h3 class="text-sm font-bold mb-3 flex items-center gap-2"><i data-lucide="radio" class="w-4 h-4 text-coral"></i> Sensor Pelampung Aktif</h3>
              <div class="space-y-3 text-xs mono">
                <div class="p-3 bg-deep rounded-lg border border-slate-800">
                  <div class="flex justify-between text-slate-300"><span>Buoy #01 - Karimunjawa</span><span class="text-success">ONLINE</span></div>
                  <div class="text-slate-500 mt-1">Suhu: 28.4°C | Salinitas: 33 PSU</div>
                </div>
                <div class="p-3 bg-deep rounded-lg border border-slate-800">
                  <div class="flex justify-between text-slate-300"><span>Buoy #02 - Selat Sunda</span><span class="text-success">ONLINE</span></div>
                  <div class="text-slate-500 mt-1">Suhu: 29.1°C | Salinitas: 32 PSU</div>
                </div>
                <div class="p-3 bg-deep rounded-lg border border-slate-800">
                  <div class="flex justify-between text-slate-300"><span>Buoy #03 - Selat Bali</span><span class="text-warn">CALIBRATING</span></div>
                  <div class="text-slate-500 mt-1">Suhu: 27.9°C | Salinitas: 34 PSU</div>
                </div>
              </div>
            </div>
          </div>
        `;

        const ctx = document.getElementById('dashboardChart').getContext('2d');
        if (this.chartInstance) this.chartInstance.destroy();
        this.chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
            datasets: [{
              label: 'Plastik & Jaring Terkumpul (Kg)',
              data: [120, 190, 310, 420, 580, 720],
              borderColor: '#0ea5e9',
              backgroundColor: 'rgba(14, 165, 233, 0.1)',
              fill: true,
              tension: 0.35
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
              y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
            }
          }
        });
      },

      // ================= VIEW: REPORTS =================
      renderReports(target) {
        const reports = DB.get('NC_REPORTS');
        target.innerHTML = `
          <div class="flex justify-between items-center mb-6">
            <div>
              <h3 class="text-sm font-bold text-white">Daftar Transaksi Sampah Pesisir</h3>
              <p class="text-xs text-slate-400">Verifikasi, timbang, dan konversi ke poin reward.</p>
            </div>
            <button onclick="App.openCreateReportModal()" class="px-4 py-2 bg-gradient-to-r from-accent to-teal2 rounded-lg text-xs font-bold text-white flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4"></i> Buat Laporan Baru</button>
          </div>

          <div class="glass rounded-xl border border-slate-800 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-card text-slate-400 uppercase mono border-b border-slate-800">
                  <tr>
                    <th class="p-3">ID TRX</th>
                    <th class="p-3">Pelapor</th>
                    <th class="p-3">Jenis Limbah</th>
                    <th class="p-3">Berat (Kg)</th>
                    <th class="p-3">Lokasi</th>
                    <th class="p-3">Status</th>
                    <th class="p-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/60">
                  ${reports.map(r => `
                    <tr class="hover:bg-card/40 transition">
                      <td class="p-3 font-bold mono text-accent">${r.id}</td>
                      <td class="p-3 font-semibold text-white">${r.reporter}</td>
                      <td class="p-3 text-slate-300">${r.type}</td>
                      <td class="p-3 mono font-bold text-teal2">${r.weight} Kg</td>
                      <td class="p-3 text-slate-400">${r.loc}</td>
                      <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                          r.status === 'Disetujui' ? 'bg-success/20 text-success border border-success/30' :
                          r.status === 'Diproses Pabrik' ? 'bg-accent/20 text-accent border border-accent/30' :
                          'bg-warn/20 text-warn border border-warn/30'
                        }">${r.status}</span>
                      </td>
                      <td class="p-3 text-center">
                        ${this.currentUser.role === 'admin' || this.currentUser.role === 'kurir' ? `
                          <button onclick="App.approveReport('${r.id}')" class="px-2 py-1 bg-slate-800 hover:bg-success hover:text-white rounded text-[11px] font-bold text-slate-300 border border-slate-700 transition">Verifikasi</button>
                        ` : `<span class="text-slate-600">-</span>`}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

      openCreateReportModal() { document.getElementById('modal-report').classList.remove('hidden'); },
      closeCreateReportModal() { document.getElementById('modal-report').classList.add('hidden'); },

      submitReport() {
        const type = document.getElementById('rep-type').value;
        const weight = parseFloat(document.getElementById('rep-weight').value) || 1;
        const locSel = document.getElementById('rep-loc');
        const locOpt = locSel.options[locSel.selectedIndex];
        const loc = locSel.value || 'Pesisir Indonesia';
        // koordinat dari lokasi yang dipilih (bukan acak), + sedikit jitter ±300 m agar titik tidak menumpuk
        const lat = parseFloat(locOpt.dataset.lat) + (Math.random() - 0.5) * 0.006;
        const lng = parseFloat(locOpt.dataset.lng) + (Math.random() - 0.5) * 0.006;

        const reports = DB.get('NC_REPORTS');
        const newRep = {
          id: 'TRX-' + Math.floor(100 + Math.random() * 900),
          reporter: this.currentUser.name,
          type,
          weight,
          loc,
          lat,
          lng,
          status: 'Menunggu',
          date: new Date().toISOString().slice(0, 16).replace('T', ' ')
        };

        reports.unshift(newRep);
        DB.set('NC_REPORTS', reports);
        DB.log('REPORT_NEW', `Laporan ${newRep.id} dibuat (${weight} Kg oleh ${this.currentUser.name})`);

        this.closeCreateReportModal();
        this.navigate('reports');
      },

      approveReport(id) {
        const reports = DB.get('NC_REPORTS');
        const rep = reports.find(r => r.id === id);
        if (!rep) return;

        rep.status = 'Disetujui';
        DB.set('NC_REPORTS', reports);

        // Tambahkan bahan baku pabrik
        const f = DB.get('NC_FACTORY');
        f.rawMaterialKg += rep.weight;
        DB.set('NC_FACTORY', f);

        // Berikan Poin Reward
        this.currentUser.points += Math.round(rep.weight * 10);
        const users = DB.get('NC_USERS');
        const uIdx = users.findIndex(u => u.id === this.currentUser.id);
        if (uIdx !== -1) { users[uIdx].points = this.currentUser.points; DB.set('NC_USERS', users); }
        this.syncUserProfile();

        DB.log('REPORT_VERIFIED', `Laporan ${id} diverifikasi. +${Math.round(rep.weight * 10)} Poin didistribusikan.`);
        this.navigate('reports');
      },
