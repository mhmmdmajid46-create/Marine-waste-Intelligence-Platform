                  <div class="cg-title">Perubahan Luas</div>
                  <div class="cg-note">Selisih terhadap tahun sebelumnya.</div>
                  <div class="cg-box"><canvas id="cg-delta"></canvas></div>
                </div>
                <div class="cg-card span2">
                  <div class="cg-title">Ringkasan per Tahun</div>
                  <div class="cg-note">Baris oranye = tahun terpilih. Δ = selisih terhadap tahun sebelumnya.</div>
                  <div style="overflow-x:auto"><table class="cg-table" id="cg-table"></table></div>
                </div>
                <div class="cg-card span2">
                  <div class="cg-title">Luas Persebaran Ikan per Tahun</div>
                  <div class="cg-note">Jenis sesuai pilihan filter Persebaran Ikan. Titik besar = tahun terpilih.</div>
                  <div class="cg-box"><canvas id="cg-fish-line"></canvas></div>
                </div>
                <div class="cg-card">
                  <div class="cg-title" id="cg-fish-donut-title">Komposisi Ikan</div>
                  <div class="cg-note">Porsi luas persebaran per jenis.</div>
                  <div class="cg-box"><canvas id="cg-fish-donut"></canvas></div>
                </div>
                <div class="cg-card span3">
                  <div class="cg-title">Ringkasan Persebaran Ikan</div>
                  <div class="cg-note">Tahun terpilih. &Delta; = selisih luas terhadap tahun sebelumnya.</div>
                  <div style="overflow-x:auto"><table class="cg-table" id="cg-fish-table"></table></div>
                </div>
              </div>
            </section>
          </div>
        `;

        this.renderYearPills();
        this.renderEcoPills();
        this.renderFishChips();
        this.renderStasiunMenu();
        this.setMenuTab(this.menuTab);
        if (window.innerWidth < 768) { const lg = document.getElementById('gis-legend'); if (lg) lg.classList.add('collapsed'); }
        this.updateGISPanels();

        setTimeout(() => {
          const st = document.getElementById('gis-status');
          if (!st) return;
          if (typeof L === 'undefined') {
            st.className = 'gis-status err';
            st.textContent = 'Leaflet gagal dimuat (cdnjs.cloudflare.com tidak bisa diakses). Periksa koneksi internet lalu muat ulang halaman.';
            return;
          }
          this.leafletMap = L.map('gis-map').setView([-2.5489, 118.0149], 5);

          // ===== Peta dasar Esri (ArcGIS Online) =====
          const esri = (svc, label) => {
            const l = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/' + svc + '/MapServer/tile/{z}/{y}/{x}', {
              attribution: 'Tiles &copy; Esri &mdash; ' + label, maxZoom: 18
            });
            l.on('tileerror', () => { const w = document.getElementById('gis-tilewarn'); if (w) w.style.display = 'block'; });
            return l;
          };
          const imagery = esri('World_Imagery', 'Source: Esri, Maxar, Earthstar Geographics');
          const oceanBase = L.layerGroup([
            esri('Ocean/World_Ocean_Base', 'GEBCO, NOAA, National Geographic, DeLorme'),
            esri('Ocean/World_Ocean_Reference', 'Esri')
          ]);
          const streets = esri('World_Street_Map', 'Esri, HERE, Garmin');
          this.baseLayers = { worldmap: streets, imagery: imagery, ocean: oceanBase };
          this.currentBase = 'imagery';
          this.overlayLayers = {};
          imagery.addTo(this.leafletMap);
          L.control.scale({ metric: true, imperial: false }).addTo(this.leafletMap);

          // Marker Laporan Sampah (TRX-111 tidak ditampilkan: koordinat acak jatuh di laut)
          const reportGroup = L.layerGroup().addTo(this.leafletMap);
          const buoyGroup = L.layerGroup().addTo(this.leafletMap);
          this.overlayLayers.sampah = reportGroup;
          this.overlayLayers.buoy = buoyGroup;
          const reports = (DB.get('NC_REPORTS') || []).filter(r => r.id !== 'TRX-111');
          reports.forEach(r => {
            const circle = L.circleMarker([r.lat, r.lng], {
              radius: 7,
              fillColor: '#0ea5e9',
              color: '#ffffff',
              weight: 1.5,
              fillOpacity: 0.8
            }).addTo(reportGroup);

            circle.bindPopup(`
              <div class="text-xs font-sans">
                <b class="text-blue-600">${r.id}</b><br/>
                <b>Jenis:</b> ${r.type}<br/>
                <b>Berat:</b> ${r.weight} Kg<br/>
                <b>Status:</b> ${r.status}
              </div>
            `);
          });

          // Marker Titik Lokasi Sampah (jurnal Pulau Tunda)
          const stasiunGroup = L.featureGroup().addTo(this.leafletMap);
          this.overlayLayers.stasiun = stasiunGroup;
          this.stasiunMarkers = {};
          this.STASIUN_SAMPAH.forEach(t => {
            const icon = L.divIcon({
              className: '',
              html: '<div class="stn-pin" style="background:' + t.warna + '">' + t.id + '</div>',
              iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
            });
            const m = L.marker([t.lat, t.lng], { icon: icon, title: 'Titik ' + t.id }).addTo(stasiunGroup);
            m.bindPopup(`
              <div class="text-xs font-sans">
                <b style="color:${t.warna}">Titik ${t.id} · ${t.zona}</b><br/>
                <span style="color:#64748b">Luas pengamatan 100 m² · posisi perkiraan (Fig. 1 jurnal)</span><br/>
                <span style="color:#64748b">${t.lat.toFixed(5)}, ${t.lng.toFixed(5)}</span>
                ${this.stasiunTemuanHtml(t)}
              </div>
            `);
            this.stasiunMarkers[t.id] = m;
          });

          // Marker Buoy Sensor Oseanografi
          const buoys = [
            { name: 'Buoy Karimunjawa', lat: -5.85, lng: 110.43, temp: 28.5 },
            { name: 'Buoy Selat Sunda', lat: -5.92, lng: 105.82, temp: 29.2 },
            { name: 'Buoy Selat Makassar', lat: -1.24, lng: 118.52, temp: 28.0 }
          ];

          buoys.forEach(b => {
            const marker = L.circleMarker([b.lat, b.lng], {
              radius: 9,
              fillColor: '#f97316',
              color: '#ffffff',
              weight: 2,
              fillOpacity: 0.9
            }).addTo(buoyGroup);

            marker.bindPopup(`
              <div class="text-xs font-sans">
                <b class="text-orange-600">📡 ${b.name}</b><br/>
                Suhu Permukaan: ${b.temp}°C<br/>
                Arus: 0.42 m/s Barat Laut
              </div>
            `);
          });

          // ===== Layer GeoJSON hasil ArcGIS (Features To JSON) =====
          this.loadGeoJSONLayers(true);
        }, 100);
      },

      // ---------- Statistik ----------
      // Luas dari Shape_Area (m2 -> ha); poligon dihitung per bagian (MultiPolygon dipecah)
      yearStats(y) {
        const d = this.GEO_DATA[y];
        if (!d) return null;
        const sumHa = fc => fc.features.reduce((t, f) => t + Number(f.properties.Shape_Area || 0), 0) / 10000;
        const parts = fc => fc.features.reduce((t, f) => t + (f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates.length : 1), 0);
        return { lamunHa: sumHa(d.lamun), karangHa: sumHa(d.karang), lamunN: parts(d.lamun), karangN: parts(d.karang) };
      },

      yearsAsc() { return [...this.years].filter(y => this.GEO_DATA[y]).sort((a, b) => a - b); },   // hanya tahun yang punya data ekosistem
      yearOrder() { return [...this.years].sort((a, b) => b - a); },   // terbaru di kiri (seperti SIDAKO)
      ecoShows(key) { return this.eco === 'semua' || this.eco === key; },

      // ---------- Pilihan tahun & ekosistem ----------
      renderYearPills() {
        const box = document.getElementById('gis-years');
        if (!box) return;
        const order = this.yearOrder();
        box.innerHTML = order.map(y =>
          '<button class="yr-pill' + (y === this.year ? ' active' : '') + '" onclick="App.setYear(\'' + y + '\')">' + y + '</button>'
        ).join('');
        const act = box.querySelector('.active');
        if (act && act.scrollIntoView) act.scrollIntoView({ inline: 'nearest', block: 'nearest' });

        const i = order.indexOf(this.year);
        const prev = document.getElementById('yr-prev'), next = document.getElementById('yr-next');
        if (prev) prev.disabled = i <= 0;
        if (next) next.disabled = i >= order.length - 1;

        const n = document.getElementById('gis-years-n');
        if (n) n.textContent = '\u00b7 ' + this.years.length + ' tahun';
      },

      renderEcoPills() {
        const box = document.getElementById('gis-eco');
        if (!box) return;
        box.innerHTML = this.ecoList.map(e =>
          '<button class="eco-btn' + (e.key === this.eco ? ' active' : '') + '"' +
          ' onclick="App.setEco(\'' + e.key + '\')"' + '>' +
          (e.dot ? '<span class="dot" style="background:' + e.dot + '"></span>' : '') + e.label  + '</button>'
        ).join('');
      },

      stepYear(d) {
        const o = this.yearOrder();
        const i = Math.min(Math.max(o.indexOf(this.year) + d, 0), o.length - 1);
        this.setYear(o[i]);
      },

      setYear(y) {
        if (!this.years.includes(y)) return;
        this.year = y;
        this.renderYearPills();
        if (this.leafletMap) this.loadGeoJSONLayers(false);
        this.updateGISPanels();
      },

      setEco(k) {
        this.eco = k;
        this.renderEcoPills();
        ['karang', 'lamun'].forEach(key => {
          const chk = document.getElementById('chk-' + key);
          if (chk) chk.checked = this.ecoShows(key);
          this.toggleOverlay(key, this.ecoShows(key));
        });
        this.updateGISPanels();
      },

      // ---------- Layer peta ----------
      loadGeoJSONLayers(fit = true) {
        const map = this.leafletMap;
        if (!map) return;
        const y = this.year;
        const gd = this.GEO_DATA[y];   // bisa kosong bila tahun belum punya data ekosistem
        let bounds = null;
        this.loadFishLayer();

        for (const cfg of this.geoLayers) {
          try {
            const old = this.overlayLayers[cfg.key];
            if (old) { map.removeLayer(old); delete this.overlayLayers[cfg.key]; }
            if (!gd) continue;
            const layer = L.geoJSON(gd[cfg.dataKey], {
              style: () => cfg.style,
              onEachFeature: (f, l) => l.bindPopup(`<div class="text-xs font-sans">${cfg.popup(f.properties || {}, y)}</div>`)
            });
            this.overlayLayers[cfg.key] = layer;
            const chk = document.getElementById('chk-' + cfg.key);
            if (!chk || chk.checked) layer.addTo(map);
            bounds = bounds ? bounds.extend(layer.getBounds()) : layer.getBounds();
          } catch (err) {
            console.error('Gagal memuat layer ' + cfg.label + ' ' + y, err);
          }
        }

        if (bounds) this.geoBounds = bounds;
        map.invalidateSize();
        if (fit) {
          const fb = this.FISH_BBOX ? L.latLngBounds(this.FISH_BBOX) : this.geoBounds;
          if (fb) map.fitBounds(fb, { padding: [30, 30], maxZoom: 15 });
        }
        this.raiseOverlays();
      },

      // ---------- Panel statistik + grafik + tabel ----------
      updateGISPanels() {
        const y = this.year;
        const ha = v => Number(v).toLocaleString('id-ID', { maximumFractionDigits: 2 });
        const setT = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        const cur = this.yearStats(y);   // null jika tahun ini tidak punya data ekosistem
        const asc = this.yearsAsc();
        const prevY = asc[asc.indexOf(y) - 1];
        const prev = prevY ? this.yearStats(prevY) : null;
        const delta = (a, b) => { const d = a - b; return (Math.abs(d) < 0.005 ? '' : (d > 0 ? '+' : '−')) + ha(Math.abs(d) < 0.005 ? 0 : Math.abs(d)) + ' ha vs ' + prevY; };
        const ecoLabel = this.ecoList.find(e => e.key === this.eco).label;

        setT('gis-badge', y + ' · ' + (this.eco === 'semua' ? 'Semua ekosistem' : ecoLabel));
        setT('stat-year', 'DATA ' + y);
        if (cur) {
          setT('stat-karang', ha(cur.karangHa) + ' ha');
          setT('stat-lamun', ha(cur.lamunHa) + ' ha');
          setT('stat-karang-d', prev ? delta(cur.karangHa, prev.karangHa) : '');
          setT('stat-lamun-d', prev ? delta(cur.lamunHa, prev.lamunHa) : '');
          setT('stat-karang-n', cur.karangN + ' poligon');
          setT('stat-lamun-n', cur.lamunN + ' poligon');
        } else {
          setT('stat-karang', '-');
          setT('stat-lamun', '-');
          setT('stat-karang-d', 'Data ekosistem ' + y + ' belum tersedia');
          setT('stat-lamun-d', '');
          setT('stat-karang-n', '-');
          setT('stat-lamun-n', '-');
        }
        setT('stat-stasiun', this.STASIUN_SAMPAH.length + ' titik · ' + this.STASIUN_JURNAL.item + ' item');
        setT('stat-sampah', ((DB.get('NC_REPORTS') || []).filter(r => r.id !== 'TRX-111').length) + ' titik');
        setT('stat-buoy', '3 stasiun');
        document.querySelectorAll('.st-karang').forEach(el => el.classList.toggle('dim', !this.ecoShows('karang')));
        document.querySelectorAll('.st-lamun').forEach(el => el.classList.toggle('dim', !this.ecoShows('lamun')));

        const bar = document.getElementById('stat-bar');
        if (bar) {
          if (cur) {
            const tot = cur.karangHa + cur.lamunHa || 1;
            bar.innerHTML = '<div style="width:' + (cur.karangHa / tot * 100) + '%;background:#f97316"></div><div style="width:' + (cur.lamunHa / tot * 100) + '%;background:#22c55e"></div>';
          } else {
            bar.innerHTML = '';
          }
        }

        const st = document.getElementById('gis-status');
        if (st && !st.classList.contains('err')) {
          st.textContent = cur
            ? 'Data ' + y + ': Terumbu Karang ' + cur.karangN + ' poligon · Lamun ' + cur.lamunN + ' poligon'
            : 'Data ' + y + ': ekosistem belum tersedia · persebaran ikan tersedia';
        }
        setT('cg-sub', 'Tahun terpilih: ' + y + ' · Ekosistem: ' + (this.eco === 'semua' ? 'terumbu karang & lamun' : ecoLabel.toLowerCase()));

        this.renderGISTable();
        this.renderGISCharts();
        this.renderFishPanels();
      },

      renderGISTable() {
        const tb = document.getElementById('cg-table');
        if (!tb) return;
        const ha = v => Number(v).toLocaleString('id-ID', { maximumFractionDigits: 2 });
        const asc = this.yearsAsc();
        const showK = this.ecoShows('karang'), showL = this.ecoShows('lamun');
        const dcell = (a, b) => {
          if (b == null) return '<td class="muted">\u2014</td>';
          const d = a - b;
          if (Math.abs(d) < 0.005) return '<td class="muted">0</td>';
          return '<td class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '\u2212') + ha(Math.abs(d)) + '</td>';
        };
        let html = '<thead><tr><th>Tahun</th>' +
          (showK ? '<th>Terumbu karang (ha)</th><th>\u0394</th>' : '') +
          (showL ? '<th>Lamun (ha)</th><th>\u0394</th>' : '') +
          '<th>Poligon' + (showK && showL ? ' (K / L)' : '') + '</th></tr></thead><tbody>';
        this.yearOrder().filter(y => this.GEO_DATA[y]).forEach(y => {
          const c = this.yearStats(y);
          const p = asc[asc.indexOf(y) - 1];
          const pr = p ? this.yearStats(p) : null;
          html += '<tr class="' + (y === this.year ? 'cur' : '') + '"><td>' + y + '</td>' +
            (showK ? '<td>' + ha(c.karangHa) + '</td>' + dcell(c.karangHa, pr && pr.karangHa) : '') +
            (showL ? '<td>' + ha(c.lamunHa) + '</td>' + dcell(c.lamunHa, pr && pr.lamunHa) : '') +
            '<td>' + (showK && showL ? c.karangN + ' / ' + c.lamunN : (showK ? c.karangN : c.lamunN)) + '</td></tr>';
        });
        tb.innerHTML = html + '</tbody>';
      },

      renderGISCharts() {
        if (typeof Chart === 'undefined') {
          document.querySelectorAll('.cg-box').forEach(b => { b.innerHTML = '<div class="cg-note">Chart.js gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</div>'; });
          return;
        }
        const fmt = v => Number(v).toLocaleString('id-ID', { maximumFractionDigits: 2 });
        const asc = this.yearsAsc();
        const stats = {}; asc.forEach(y => { stats[y] = this.yearStats(y); });
        const COL = { karang: '#f97316', lamun: '#22c55e' };
        const faded = c => c === '#f97316' ? 'rgba(249,115,22,.4)' : 'rgba(34,197,94,.4)';
        const grid = 'rgba(148,163,184,.12)', tick = '#94a3b8', txt = '#cbd5e1';

        // label angka di atas/bawah batang
        const valueLabels = {
          id: 'valueLabels',
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            ctx.save(); ctx.font = '600 11px sans-serif'; ctx.fillStyle = '#e2e8f0'; ctx.textAlign = 'center';
            chart.data.datasets.forEach((ds, i) => {
              chart.getDatasetMeta(i).data.forEach((bar, j) => {
                const v = ds.data[j]; if (v == null) return;
                const neg = v < 0;
                ctx.textBaseline = neg ? 'top' : 'bottom';
                ctx.fillText(Number(v).toLocaleString('id-ID', { maximumFractionDigits: 1 }), bar.x, bar.y + (neg ? 4 : -4));
              });
            });
            ctx.restore();
          }
        };
        const axes = (title) => ({
          x: { ticks: { color: tick }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { color: tick }, grid: { color: grid }, title: { display: !!title, text: title, color: tick } }
        });
        const mk = (id, cfg) => {
          const cv = document.getElementById(id);
          if (!cv) return;
          if (this.gisCharts[id]) { try { this.gisCharts[id].destroy(); } catch (e) {} }
          this.gisCharts[id] = new Chart(cv, cfg);
        };
        const dsBar = (key, label, values, highlightYears) => ({
          label, data: values, borderColor: COL[key], borderWidth: 1, borderRadius: 6,
          backgroundColor: highlightYears ? highlightYears.map(y => y === this.year ? COL[key] : faded(COL[key])) : COL[key]
        });
        const keys = ['karang', 'lamun'].filter(k => this.ecoShows(k));
        const NAME = { karang: 'Terumbu Karang', lamun: 'Lamun' };
        const HA = { karang: 'karangHa', lamun: 'lamunHa' };
        const tip = { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmt(c.parsed.y) + ' ha' } };

        // 1) Luas per tahun
        mk('cg-luas', {
          type: 'bar',
          data: { labels: asc, datasets: keys.map(k => dsBar(k, NAME[k], asc.map(y => +stats[y][HA[k]].toFixed(2)), asc)) },
          options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } },
            plugins: { legend: { labels: { color: txt, usePointStyle: true, boxWidth: 8 } }, tooltip: tip },
            scales: axes('Luas (ha)') },
          plugins: [valueLabels]
        });

        // 2) Perubahan luas vs tahun sebelumnya
        const dl = asc.slice(1);
        mk('cg-delta', {
          type: 'bar',
          data: { labels: dl.map(y => y + ' vs ' + asc[asc.indexOf(y) - 1]),
                  datasets: keys.map(k => dsBar(k, NAME[k], dl.map(y => Math.round((stats[y][HA[k]] - stats[asc[asc.indexOf(y) - 1]][HA[k]]) * 100) / 100 + 0))) },
          options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18, bottom: 14 } },
            plugins: { legend: { labels: { color: txt, usePointStyle: true, boxWidth: 8 } }, tooltip: tip },
            scales: { x: { ticks: { color: tick }, grid: { display: false } },
                      y: { ticks: { color: tick }, grid: { color: grid }, title: { display: true, text: '\u0394 luas (ha)', color: tick } } } },
          plugins: [valueLabels]
        });

        // 3) Proporsi luas tahun terpilih
        const dy = stats[this.year] ? this.year : asc[asc.length - 1];   // tahun tanpa data ekosistem: pakai tahun terbaru
        const cur = stats[dy];
        const total = cur.karangHa + cur.lamunHa;
        const dn = document.getElementById('cg-donut-title');
        if (dn) dn.textContent = 'Proporsi Luas ' + dy + (dy !== this.year ? ' (terbaru)' : '');
        mk('cg-donut', {
          type: 'doughnut',
          data: { labels: ['Terumbu Karang', 'Lamun'],
                  datasets: [{ data: [+cur.karangHa.toFixed(2), +cur.lamunHa.toFixed(2)], backgroundColor: [COL.karang, COL.lamun], borderColor: '#0a1424', borderWidth: 3 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '68%',
            plugins: { legend: { position: 'bottom', labels: { color: txt, usePointStyle: true, boxWidth: 8 } },
                       tooltip: { callbacks: { label: c => ' ' + c.label + ': ' + fmt(c.parsed) + ' ha (' + (c.parsed / total * 100).toFixed(1).replace('.', ',') + '%)' } } } },
          plugins: [{
            id: 'centerText',
            afterDraw(chart) {
              const a = chart.chartArea, ctx = chart.ctx;
              const cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2;
              ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillStyle = '#fff'; ctx.font = '700 20px sans-serif'; ctx.fillText(fmt(total), cx, cy - 8);
              ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.fillText('ha total', cx, cy + 12);
              ctx.restore();
            }
          }]
        });
      },

      // ================= PERSEBARAN IKAN =================
      fishKm(y, k) {
        const fc = this.FISH_DATA[y] && this.FISH_DATA[y][k];
        if (!fc) return { km2: 0, n: 0 };
        return { km2: fc.features.reduce((t, f) => t + f.properties.a, 0), n: fc.features.length };
      },
      allYearsAsc() { return [...this.years].sort((a, b) => a - b); },
      fishSelected() { return this.FISH_SPECIES.filter(s => this.fishSel.has(s.key)); },
      fmtKm(v) { return Number(v).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
      deltaKm(a, b) {
        const d = a - b;
        if (Math.abs(d) < 0.005) return '0,00 km²';
        return (d > 0 ? '+' : '−') + this.fmtKm(Math.abs(d)) + ' km²';
      },

      renderFishChips() {
        const box = document.getElementById('gis-fish');
        if (!box) return;
        box.innerHTML = this.FISH_SPECIES.map(s => {
          const on = this.fishSel.has(s.key);
          const d = this.fishKm(this.year, s.key);
          return '<button class="fish-item' + (on ? ' active' : '') + '" style="--c:' + s.color + '" role="checkbox" aria-checked="' + on + '" onclick="App.toggleFish(\'' + s.key + '\')">' +
            '<span class="box">&#10003;</span><span class="nm">' + s.label + '</span>' +
            '<span class="mt"><b>' + this.fmtKm(d.km2) + ' km²</b>' + d.n + ' poligon</span></button>';
        }).join('');
        const sub = document.getElementById('fish-sub');
        if (sub) sub.textContent = 'Data tahun ' + this.year;
        const lb = document.getElementById('fish-dd-label');
        if (lb) lb.textContent = this.fishSel.size ? this.fishSel.size + ' dari ' + this.FISH_SPECIES.length + ' jenis ditampilkan' : 'Belum ada jenis dipilih';
        const dots = document.getElementById('fish-dots');
        if (dots) dots.innerHTML = this.fishSelected().map(f => '<i style="background:' + f.color + '"></i>').join('');
        const tn = document.getElementById('tab-ikan-n');
        if (tn) tn.textContent = this.fishSel.size + '/' + this.FISH_SPECIES.length;
      },

      toggleLegend() {
        const el = document.getElementById('gis-legend');
        if (el) el.classList.toggle('collapsed');
      },

      toggleFishMenu(ev) {
        if (ev) ev.stopPropagation();
        const dd = document.getElementById('fish-dd');
        if (!dd) return;
        dd.classList.toggle('open');
        if (!this._ddBound) {
          this._ddBound = true;
          document.addEventListener('click', () => { const d = document.getElementById('fish-dd'); if (d) d.classList.remove('open'); });
          document.addEventListener('keydown', e => { if (e.key === 'Escape') { const d = document.getElementById('fish-dd'); if (d) d.classList.remove('open'); } });
        }
      },

      // ---------- Menu tab & stasiun sampah ----------
      setMenuTab(t) {
        this.menuTab = t;
        ['ikan', 'sampah'].forEach(k => {
          const b = document.getElementById('tab-' + k), p = document.getElementById('menu-' + k);
          if (b) { b.classList.toggle('active', k === t); b.setAttribute('aria-selected', k === t); }
          if (p) p.classList.toggle('show', k === t);
        });
      },

      renderStasiunMenu() {
        const J = this.STASIUN_JURNAL;
        const tiles = document.getElementById('jr-tiles');
        if (tiles) tiles.innerHTML = [
          [J.stasiun, 'titik lokasi'], [J.luas, 'total luas'], [J.item, 'item sampah'],
          [J.berat, 'total berat'], [J.kerapatan, 'kerapatan'], [J.kelimpahan, 'kelimpahan']
        ].map(x => '<div class="jr-tile"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join('');
        const box = document.getElementById('gis-stasiun');
        if (box) box.innerHTML = this.STASIUN_SAMPAH.map(t =>
          '<button class="st-item" style="--c:' + t.warna + '" onclick="App.focusStasiun(' + t.id + ')">' +
          '<span class="st-num">' + t.id + '</span><span><div class="nm">Titik ' + t.id + '</div>' +
          '<div class="zn">' + t.zona + '</div><div class="hl">' + t.fokus + '</div></span></button>'
        ).join('');
        const tn = document.getElementById('tab-sampah-n');
        if (tn) tn.textContent = this.STASIUN_SAMPAH.length;
      },

      stasiunTemuanHtml(t) {
        const g = {};
        t.temuan.forEach(x => { (g[x[0]] = g[x[0]] || []).push(x); });
        return Object.keys(g).map(k =>
          '<div style="margin-top:6px"><b>' + k + '</b><ul style="margin:2px 0 0 14px;padding:0;list-style:disc">' +
          g[k].map(x => '<li>' + x[1] + ': ' + x[2] + '</li>').join('') + '</ul></div>').join('');
      },

      focusStasiun(id) {
        const m = this.stasiunMarkers && this.stasiunMarkers[id];
        if (!this.leafletMap || !m) return;
        const chk = document.getElementById('chk-stasiun');
        if (chk && !chk.checked) { chk.checked = true; this.toggleOverlay('stasiun', true); }
        this.leafletMap.invalidateSize();
        this.leafletMap.setView(m.getLatLng(), 16);
        m.openPopup();
        const w = document.querySelector('.gis-map-wrap');
        if (w && w.scrollIntoView) w.scrollIntoView({ behavior: 'smooth', block: 'center' });
      },
      toggleFish(k) { if (this.fishSel.has(k)) this.fishSel.delete(k); else this.fishSel.add(k); this.refreshFish(); },
      setFishAll(on) { this.fishSel = new Set(on ? this.FISH_SPECIES.map(s => s.key) : []); this.refreshFish(); },
      refreshFish() { if (this.leafletMap) this.loadFishLayer(); this.updateGISPanels(); },

      loadFishLayer() {
        const map = this.leafletMap;
        if (!map) return;
        const old = this.overlayLayers.ikan;
        if (old) map.removeLayer(old);
        const y = this.year;
        const grp = L.featureGroup();
        this.fishSelected().forEach(s => {
          const fc = this.FISH_DATA[y] && this.FISH_DATA[y][s.key];
          if (!fc) return;
          L.geoJSON(fc, {
            style: () => ({ color: s.color, weight: 0.8, fillColor: s.color, fillOpacity: 0.45 }),
            onEachFeature: (f, l) => l.bindPopup('<div class="text-xs font-sans"><b style="color:' + s.color + '">Ikan ' + s.label + ' ' + y + '</b><br/>Kelas (gridcode): ' + f.properties.g + '<br/>Luas: ' + this.fmtKm(f.properties.a) + ' km²</div>')
          }).addTo(grp);
        });
        this.overlayLayers.ikan = grp;
        const chk = document.getElementById('chk-ikan');
        if (!chk || chk.checked) grp.addTo(map);
        this.raiseOverlays();
        this.renderFishLegend();
      },

      // ekosistem, laporan sampah, dan buoy selalu di atas lapisan ikan
      raiseOverlays() {
        if (!this.leafletMap) return;
        ['karang', 'lamun', 'sampah', 'buoy'].forEach(k => {
          const l = this.overlayLayers[k];
          if (!l || !this.leafletMap.hasLayer(l)) return;
          if (l.bringToFront) l.bringToFront();
          else if (l.eachLayer) l.eachLayer(x => { if (x.bringToFront) x.bringToFront(); });
        });
      },

      renderFishLegend() {
        const el = document.getElementById('legend-fish');
        if (!el) return;
        const sel = this.fishSelected();
        el.innerHTML = sel.length
          ? '<div class="lg-cap">Persebaran ikan</div><div class="lg-grid">' + sel.map(s =>
              '<div class="lg-row"><span class="gis-sw" style="background:' + s.color + ';border-radius:3px"></span>' + s.label + '</div>').join('') + '</div>'
          : '';
        const chk = document.getElementById('chk-ikan');
        el.style.display = (chk && !chk.checked) ? 'none' : '';
      },

      renderFishPanels() {
        const y = this.year, sel = this.fishSelected();
        this.renderFishChips();
        const asc = this.allYearsAsc();
        const prevY = asc[asc.indexOf(y) - 1];
        const tot = yy => sel.reduce((t, s) => t + this.fishKm(yy, s.key).km2, 0);
        const cur = tot(y);
        const setT = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
        setT('stat-fish-km', this.fmtKm(cur) + ' km²');
        setT('stat-fish-km-d', prevY ? this.deltaKm(cur, tot(prevY)) + ' vs ' + prevY : '');
        setT('stat-fish-n', sel.length + ' dari ' + this.FISH_SPECIES.length + ' jenis');
        this.renderFishTable(sel, y, prevY);
        this.renderFishCharts(sel, y, asc);
      },

      renderFishTable(sel, y, prevY) {
        const tb = document.getElementById('cg-fish-table');
        if (!tb) return;
        const dcell = (a, b) => {
          if (b == null) return '<td class="muted">—</td>';
          const d = a - b;
          if (Math.abs(d) < 0.005) return '<td class="muted">0</td>';
          return '<td class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '−') + this.fmtKm(Math.abs(d)) + '</td>';
        };
        let html = '<thead><tr><th>Jenis ikan</th><th>Luas (km²)</th><th>Δ vs ' + (prevY || '-') + '</th><th>Poligon</th></tr></thead><tbody>';
        if (!sel.length) {
          tb.innerHTML = html + '<tr><td colspan="4" class="muted" style="text-align:left">Belum ada jenis ikan dipilih.</td></tr></tbody>';
          return;
        }
        let tA = 0, tP = 0, tN = 0, havePrev = !!prevY;
        sel.forEach(s => {
          const c = this.fishKm(y, s.key);
          const p = prevY ? this.fishKm(prevY, s.key) : null;
          tA += c.km2; tN += c.n; if (p) tP += p.km2;
          html += '<tr><td><span class="fish-dot" style="background:' + s.color + '"></span>' + s.label + '</td><td>' + this.fmtKm(c.km2) + '</td>' + dcell(c.km2, p && p.km2) + '<td>' + c.n + '</td></tr>';
        });
        html += '<tr style="font-weight:700;border-top:1px solid #334155"><td>Total</td><td>' + this.fmtKm(tA) + '</td>' + dcell(tA, havePrev ? tP : null) + '<td>' + tN + '</td></tr>';
        tb.innerHTML = html + '</tbody>';
      },

      renderFishCharts(sel, y, asc) {
        if (typeof Chart === 'undefined') return;
        const grid = 'rgba(148,163,184,.12)', tick = '#94a3b8', txt = '#cbd5e1';
        const mk = (id, cfg) => {
          const cv = document.getElementById(id);
          if (!cv) return;
          if (this.gisCharts[id]) { try { this.gisCharts[id].destroy(); } catch (e) {} }
          this.gisCharts[id] = new Chart(cv, cfg);
        };
        const fmtKm = v => this.fmtKm(v);

        mk('cg-fish-line', {
          type: 'line',
          data: { labels: asc, datasets: sel.map(s => ({
            label: s.label, data: asc.map(yy => +this.fishKm(yy, s.key).km2.toFixed(2)),
            borderColor: s.color, backgroundColor: s.color, borderWidth: 2, tension: 0.25,
            pointRadius: asc.map(yy => yy === y ? 6 : 3), pointHoverRadius: 7
          })) },
          options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
            plugins: { legend: { labels: { color: txt, usePointStyle: true, boxWidth: 8 } },
                       tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmtKm(c.parsed.y) + ' km²' } } },
            scales: { x: { ticks: { color: tick }, grid: { display: false } },
                      y: { beginAtZero: true, ticks: { color: tick }, grid: { color: grid }, title: { display: true, text: 'Luas (km²)', color: tick } } } }
        });

        const vals = sel.map(s => +this.fishKm(y, s.key).km2.toFixed(2));
        const total = vals.reduce((a, b) => a + b, 0);
        const dt = document.getElementById('cg-fish-donut-title');
        if (dt) dt.textContent = 'Komposisi Ikan ' + y;
        mk('cg-fish-donut', {
          type: 'doughnut',
          data: { labels: sel.map(s => s.label), datasets: [{ data: vals, backgroundColor: sel.map(s => s.color), borderColor: '#0a1424', borderWidth: 3 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '62%',
            plugins: { legend: { position: 'bottom', labels: { color: txt, usePointStyle: true, boxWidth: 8 } },
                       tooltip: { callbacks: { label: c => ' ' + c.label + ': ' + fmtKm(c.parsed) + ' km² (' + (total ? (c.parsed / total * 100).toFixed(1).replace('.', ',') : '0') + '%)' } } } },
          plugins: [{
            id: 'fishCenter',
            afterDraw(chart) {
              if (!total) return;
              const a = chart.chartArea, ctx = chart.ctx;
              const cx = (a.left + a.right) / 2, cy = (a.top + a.bottom) / 2;
              ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillStyle = '#fff'; ctx.font = '700 18px sans-serif'; ctx.fillText(fmtKm(total), cx, cy - 8);
              ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.fillText('km² total', cx, cy + 12);
              ctx.restore();
            }
          }]
        });
      },

      toggleLayerPanel() {
        const el = document.getElementById('gis-layer-panel');
        if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
      },

      setBasemap(key) {
        if (!this.leafletMap || !this.baseLayers) return;
        Object.values(this.baseLayers).forEach(l => this.leafletMap.removeLayer(l));
        this.baseLayers[key].addTo(this.leafletMap);
        this.currentBase = key;
        // overlay tetap di atas peta dasar
        Object.values(this.overlayLayers || {}).forEach(l => { if (this.leafletMap.hasLayer(l) && l.bringToFront) l.bringToFront(); });
      },

      toggleOverlay(key, on) {
        const l = this.overlayLayers && this.overlayLayers[key];
        if (!l || !this.leafletMap) return;
        if (on) l.addTo(this.leafletMap); else this.leafletMap.removeLayer(l);
        if (key === 'stasiun') {
          const lg = document.getElementById('legend-stasiun');
          if (lg) lg.style.display = on ? '' : 'none';
        }
        if (key === 'ikan') {
          const lg = document.getElementById('legend-fish');
          if (lg) lg.style.display = on ? '' : 'none';
          if (on) this.raiseOverlays();
        }
      },

      zoomGIS(where) {
        if (!this.leafletMap) return;
        this.leafletMap.invalidateSize();
        if (where === 'tunda' && this.geoBounds) this.leafletMap.fitBounds(this.geoBounds, { padding: [30, 30], maxZoom: 15 });
        else if (where === 'stasiun' && this.overlayLayers.stasiun) {
          const chk = document.getElementById('chk-stasiun');
          if (chk && !chk.checked) { chk.checked = true; this.toggleOverlay('stasiun', true); }
          this.leafletMap.fitBounds(this.overlayLayers.stasiun.getBounds(), { padding: [50, 50], maxZoom: 15 });
        }
        else if (where === 'ikan' && this.FISH_BBOX) this.leafletMap.fitBounds(L.latLngBounds(this.FISH_BBOX), { padding: [30, 30], maxZoom: 15 });
        else this.leafletMap.setView([-2.5489, 118.0149], 5);
      },

      // ================= VIEW: FACTORY =================
      renderFactory(target) {
        const f = DB.get('NC_FACTORY');
        target.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="glass p-6 rounded-2xl border border-slate-800">
              <h3 class="text-base font-bold text-white mb-2 flex items-center gap-2"><i data-lucide="cog" class="w-5 h-5 text-accent"></i> Stasiun Konversi & Daur Ulang Plastik</h3>
              <p class="text-xs text-slate-400 mb-6">Mengubah sampah jaring dan botol hasil sitaan pesisir menjadi pelet plastik standar industri.</p>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="p-4 bg-deep rounded-xl border border-slate-800">
                  <span class="text-xs text-slate-400">Bahan Baku Siap Giling</span>
                  <div class="text-2xl font-black text-white mono mt-1">${f.rawMaterialKg.toFixed(1)} <span class="text-xs text-slate-400">Kg</span></div>
                </div>
                <div class="p-4 bg-deep rounded-xl border border-slate-800">
                  <span class="text-xs text-slate-400">Pelet Plastik Tersedia</span>
                  <div class="text-2xl font-black text-teal2 mono mt-1">${f.pelletsProducedKg.toFixed(1)} <span class="text-xs text-slate-400">Kg</span></div>
                </div>
                <div class="p-4 bg-deep rounded-xl border border-slate-800">
                  <span class="text-xs text-slate-400">Barang Jadi Eco-Product</span>
                  <div class="text-2xl font-black text-coral mono mt-1">${f.ecoProductsCount} <span class="text-xs text-slate-400">Pcs</span></div>
                </div>
              </div>

              <div class="flex flex-wrap gap-4">
                <button onclick="App.processPellets()" class="px-5 py-2.5 rounded-xl bg-accent text-white font-bold text-xs hover:opacity-90 flex items-center gap-2"><i data-lucide="flame" class="w-4 h-4"></i> Lelehkan Bahan Jadi Pelet (-50 Kg)</button>
                <button onclick="App.craftProduct()" class="px-5 py-2.5 rounded-xl bg-teal2 text-white font-bold text-xs hover:opacity-90 flex items-center gap-2"><i data-lucide="hammer" class="w-4 h-4"></i> Cetak Kacamata / Paving (-20 Kg Pelet)</button>
              </div>
            </div>
          </div>
        `;
      },

      processPellets() {
        const f = DB.get('NC_FACTORY');
        if (f.rawMaterialKg < 50) { alert('Bahan baku tidak mencukupi (minimal 50 Kg)!'); return; }
        f.rawMaterialKg -= 50;
        f.pelletsProducedKg += 45; // Efisiensi 90%
        DB.set('NC_FACTORY', f);
        DB.log('FACTORY_PELLET', 'Konversi 50 Kg sampah -> 45 Kg pelet rPET selesai.');
        this.renderFactory(document.getElementById('main-view'));
      },

      craftProduct() {
        const f = DB.get('NC_FACTORY');
        if (f.pelletsProducedKg < 20) { alert('Pelet tidak mencukupi (minimal 20 Kg)!'); return; }
        f.pelletsProducedKg -= 20;
        f.ecoProductsCount += 5;
        DB.set('NC_FACTORY', f);
        DB.log('FACTORY_CRAFT', 'Pencetakan 5 unit kacamata daur ulang berhasil.');
        this.renderFactory(document.getElementById('main-view'));
      },

      // ================= VIEW: GAME =================
      renderGame(target) {
        target.innerHTML = `
          <div class="max-w-2xl mx-auto flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-3">
              <div>
                <h3 class="text-sm font-bold text-white">Ocean Trash Collector Mini-Game</h3>
                <p class="text-xs text-slate-400">Gunakan panah ⬅️ ➡️ atau A/D pada keyboard untuk kemudikan kapal.</p>
              </div>
              <div class="mono text-xs bg-deep border border-slate-800 px-3 py-1.5 rounded-lg text-yellow-400">
                Skor Game: <span id="game-score" class="font-bold">0</span>
              </div>
            </div>
            <canvas id="gameCanvas" width="600" height="350" class="w-full bg-[#041628] rounded-2xl border border-slate-700 shadow-2xl"></canvas>
            <div class="mt-4 text-[11px] text-slate-500 mono">Tangkap sampah plastik mengapung dan bersihkan lautan!</div>
          </div>
        `;

        this.initGameCanvas();
      },

      initGameCanvas() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let shipX = 270;
        let score = 0;
        let trashList = [];
        let leftPressed = false;
        let rightPressed = false;

        const handleKeyDown = (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
          if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
        };
        const handleKeyUp = (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
          if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        const loop = () => {
          // Update
          if (leftPressed && shipX > 10) shipX -= 5;
          if (rightPressed && shipX < 530) shipX += 5;

          // Spawn Trash
          if (Math.random() < 0.03) {
            trashList.push({ x: Math.random() * 560 + 20, y: -10, speed: 2 + Math.random() * 2 });
          }

          // Clear Canvas
          ctx.fillStyle = '#041628';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw Sea Waves
          ctx.strokeStyle = 'rgba(14, 165, 233, 0.15)';
          ctx.beginPath();
          for (let i = 0; i < canvas.width; i += 20) {
            ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
          }
          ctx.stroke();

          // Draw Ship
          ctx.fillStyle = '#0ea5e9';
          ctx.fillRect(shipX, 300, 60, 20);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(shipX + 22, 285, 16, 15);

          // Draw Trash & Check Hit
          for (let i = trashList.length - 1; i >= 0; i--) {
            const t = trashList[i];
            t.y += t.speed;

            // Render Trash Bottle
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
            ctx.fill();

            // Collision Detection
            if (t.y >= 295 && t.y <= 325 && t.x >= shipX - 10 && t.x <= shipX + 70) {
              score += 10;
              document.getElementById('game-score').innerText = score;
              trashList.splice(i, 1);
              continue;
            }

            // Remove out of bounds
            if (t.y > 360) trashList.splice(i, 1);
          }

          App.gameLoop = requestAnimationFrame(loop);
        };

        App.gameLoop = requestAnimationFrame(loop);
      },

      // ================= VIEW: AUDIT LOG =================
      renderAudit(target) {
        const logs = DB.get('NC_LEDGER');
        target.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-4">
            <div class="flex justify-between items-center mb-2">
              <div>
                <h3 class="text-sm font-bold text-white">Buku Besar Audit Sistem (Ledger)</h3>
                <p class="text-xs text-slate-400">Rekaman permanen setiap transaksi, verifikasi, dan aksi sirkular.</p>
              </div>
              <span class="mono text-xs text-teal2 bg-teal2/10 px-3 py-1 rounded border border-teal2/20">IMMUTABLE LOGS</span>
            </div>

            <div class="glass rounded-xl border border-slate-800 p-4 space-y-2 mono text-xs">
              ${logs.map(l => `
                <div class="p-3 bg-deep rounded-lg border border-slate-800 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <span class="text-accent font-bold">[${l.action}]</span>
                    <span class="text-slate-300 font-sans">${l.note}</span>
                  </div>
                  <span class="text-slate-500">${l.time}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    };

    // ================= INITIALIZATION ENTRY POINT =================
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
